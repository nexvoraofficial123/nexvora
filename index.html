<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Store</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
      padding-bottom: 90px;
    }

    .announcement-bar {
      background: #f4e8ff;
      color: #5d2f86;
      text-align: center;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 1100;
    }

    .top-header {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      position: sticky;
      top: 40px;
      z-index: 1000;
    }

    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      flex-wrap: wrap;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 180px;
    }

    .logo-wrap img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 8px;
    }

    .logo a {
      text-decoration: none;
      color: #111;
      font-size: 24px;
      font-weight: 700;
    }

    .search-bar {
      display: flex;
      flex: 1;
      max-width: 520px;
      min-width: 260px;
    }

    .search-bar input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-right: none;
      border-radius: 8px 0 0 8px;
      outline: none;
    }

    .search-bar button {
      padding: 11px 18px;
      border: 1px solid #ccc;
      background: #111;
      color: #fff;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid #f0f0f0;
      background: #fff;
    }

    .nav-item {
      text-decoration: none;
      color: #222;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      min-width: 70px;
    }

    .nav-icon {
      font-size: 22px;
      line-height: 1;
    }

    .nav-item:hover {
      opacity: 0.75;
    }

    .hero {
      padding: 60px 24px;
      text-align: center;
      background: linear-gradient(180deg, #fafafa, #fff);
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      color: #555;
    }

    .content {
      padding: 30px 24px 120px;
      min-height: 500px;
    }

    .free-shipping {
      position: fixed;
      left: 16px;
      bottom: 86px;
      background: #111;
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 9998;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    .whatsapp-float {
      position: fixed;
      right: 16px;
      bottom: 86px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #25d366;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 29px;
      z-index: 9999;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .whatsapp-float:hover {
      transform: scale(1.06);
    }

    .bottom-fixed-menu {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      border-top: 1px solid #e6e6e6;
      box-shadow: 0 -4px 18px rgba(0,0,0,0.06);
      z-index: 10000;
    }

    @media (max-width: 900px) {
      .header-main {
        padding: 12px 16px;
      }

      .search-bar {
        order: 3;
        width: 100%;
        max-width: 100%;
      }

      .hero h1 {
        font-size: 32px;
      }
    }

    @media (max-width: 600px) {
      .logo a {
        font-size: 20px;
      }

      .logo-wrap img {
        width: 36px;
        height: 36px;
      }

      .free-shipping {
        left: 12px;
        bottom: 82px;
        font-size: 12px;
        padding: 8px 12px;
      }

      .whatsapp-float {
        right: 12px;
        bottom: 82px;
        width: 50px;
        height: 50px;
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <div class="announcement-bar">
    Deliver Islandwide
  </div>

  <header class="top-header">
    <div class="header-main">
      <div class="logo-wrap">
        <img src="https://via.placeholder.com/80x80?text=Logo" alt="Store Logo" />
        <div class="logo">
          <a href="index.html">MyStore</a>
        </div>
      </div>

      <div class="search-bar">
        <input type="text" placeholder="Search products..." />
        <button type="button">Search</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to MyStore</h1>
      <p>Find products you love at the best price.</p>
    </section>

    <section class="content">
      <h2>Home page content here</h2>
      <p>You can add products, banners, and more sections below.</p>
    </section>
  </main>

  <div class="free-shipping">Free Shipping</div>

  <a class="whatsapp-float" href="https://wa.me/94700000000" target="_blank" aria-label="Chat on WhatsApp">
    &#128172;
  </a>

  <nav class="bottom-fixed-menu">
    <div class="bottom-nav">
      <a href="index.html" class="nav-item">
        <span class="nav-icon">&#8962;</span>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">&#9776;</span>
        <span>Categories</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">&#128722;</span>
        <span>Cart</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">&#128100;</span>
        <span>Account</span>
      </a>
    </div>
  </nav>

</body>
</html>
