<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Store</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    .announcement-bar {
      background: #f4e8ff;
      color: #5d2f86;
      text-align: center;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 700;
    }

    .top-header {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      background: #fff;
    }

    .logo a {
      text-decoration: none;
      color: #111;
      font-size: 24px;
      font-weight: 700;
    }

    .search-bar {
      display: flex;
      flex: 1;
      max-width: 520px;
    }

    .search-bar input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-right: none;
      border-radius: 8px 0 0 8px;
      outline: none;
    }

    .search-bar button {
      padding: 11px 18px;
      border: 1px solid #ccc;
      background: #111;
      color: #fff;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .action-link {
      text-decoration: none;
      color: #111;
      font-weight: 600;
      white-space: nowrap;
    }

    .bottom-nav {
      display: flex;
      gap: 28px;
      padding: 12px 24px;
      border-top: 1px solid #f0f0f0;
      background: #fff;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #222;
      font-weight: 600;
    }

    .bottom-nav a:hover,
    .action-link:hover,
    .logo a:hover {
      opacity: 0.75;
    }

    .hero {
      padding: 60px 24px;
      text-align: center;
      background: linear-gradient(180deg, #fafafa, #fff);
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      color: #555;
    }

    .section-title {
      padding: 30px 24px 10px;
      font-size: 26px;
      font-weight: 700;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px 24px 60px;
    }

    .product-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 16px;
    }

    .product-info h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      margin-bottom: 12px;
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    .add-btn:hover {
      background: #333;
    }

    .whatsapp-float {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #25d366;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 30px;
      z-index: 9999;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .whatsapp-float:hover {
      transform: scale(1.08);
      opacity: 0.95;
    }

    @media (max-width: 900px) {
      .header-main {
        flex-wrap: wrap;
      }

      .search-bar {
        order: 3;
        width: 100%;
        max-width: 100%;
      }

      .header-actions {
        margin-left: auto;
      }

      .bottom-nav {
        flex-wrap: wrap;
        gap: 16px;
      }

      .hero h1 {
        font-size: 32px;
      }
    }

    @media (max-width: 600px) {
      .header-main {
        padding: 12px 16px;
      }

      .bottom-nav {
        padding: 12px 16px;
      }

      .header-actions {
        width: 100%;
        justify-content: space-between;
      }

      .whatsapp-float {
        right: 14px;
        bottom: 14px;
        width: 52px;
        height: 52px;
        font-size: 28px;
      }

      .hero {
        padding: 40px 16px;
      }

      .product-grid {
        padding: 16px 16px 50px;
      }
    }
  </style>
</head>
<body>

  <div class="announcement-bar">
    Deliver Islandwide
  </div>

  <header class="top-header">
    <div class="header-main">
      <div class="logo">
        <a href="index.html">MyStore</a>
      </div>

      <div class="search-bar">
        <input type="text" placeholder="Search products..." />
        <button type="button">Search</button>
      </div>

      <div class="header-actions">
        <a href="#" class="action-link">Cart</a>
        <a href="#" class="action-link">Create Account</a>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html">Menu</a>
      <a href="#">Shop</a>
      <a href="#">Contact</a>
      <a href="#">About Us</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to MyStore</h1>
    <p>Find products you love at the best price.</p>
  </section>

  <h2 class="section-title">Featured Products</h2>

  <section class="product-grid">
    <div class="product-card">
      <img src="https://via.placeholder.com/600x400?text=Product+1" alt="Product 1">
      <div class="product-info">
        <h3>Product Name 1</h3>
        <div class="price">LKR 1,250.00</div>
        <button class="add-btn">Add to Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/600x400?text=Product+2" alt="Product 2">
      <div class="product-info">
        <h3>Product Name 2</h3>
        <div class="price">LKR 1,850.00</div>
        <button class="add-btn">Add to Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/600x400?text=Product+3" alt="Product 3">
      <div class="product-info">
        <h3>Product Name 3</h3>
        <div class="price">LKR 2,100.00</div>
        <button class="add-btn">Add to Cart</button>
      </div>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/600x400?text=Product+4" alt="Product 4">
      <div class="product-info">
        <h3>Product Name 4</h3>
        <div class="price">LKR 990.00</div>
        <button class="add-btn">Add to Cart</button>
      </div>
    </div>
  </section>

  <a class="whatsapp-float" href="https://wa.me/94700000000" target="_blank" aria-label="Chat on WhatsApp">
    &#128172;
  </a>

</body>
</html>
